# Runs `nix flake check` on each pull request to main or release/next.
# The owner has no GitHub Actions minutes, so the job runs on the self-hosted
# runner on ralpha (aarch64 Linux). The runner service is in gracecraft/ghostbook.nix.
# `nix flake check` checks only the system it runs on. The flake also has
# x86_64-linux and aarch64-darwin outputs. No runner or minutes are available
# for those systems, so this workflow does not check them.
name: CI

# `pull_request_target` runs the workflow from the base branch, not from the
# pull request. A fork pull request cannot change this guard and then run code
# on the self-hosted runner. The job checks out the pull request head only
# after the guard allows it. `permissions: contents: read` keeps the token
# read-only. This workflow uses no secrets.
on:
  pull_request_target:
    branches: [main, release/next]

permissions:
  contents: read

# One run per pull request. A new push stops the older run, so the loops that
# share ralpha do not wait behind stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    # A self-hosted runner must not run code from an untrusted fork. These two
    # repositories are trusted: the upstream repository, and the owner's fork
    # that the loops push to. Any other fork is skipped. The loop token cannot
    # read the repository setting "Fork pull request workflows" (HTTP 403), so
    # this list is the guard. Add a repository here only after the owner
    # approves it in Actions -> General -> Fork pull request workflows.
    if: >-
      contains(
        fromJSON('["gracecraft-software/lupin","gracecraft-ro/lupin"]'),
        github.event.pull_request.head.repo.full_name
      )
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # The runner is NixOS and has Nix. It may not enable flakes for a
      # non-interactive shell, so set the feature here.
      NIX_CONFIG: experimental-features = nix-command flakes
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ralpha runner is aarch64 Linux. It has Nix, so this workflow
          # does not install Nix and does not change the host.
          - system: aarch64-linux
            runner: [self-hosted, linux, ARM64]
    steps:
      # The event runs on the base branch. Check out the pull request head to
      # test the change. The head can be in the trusted fork.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Fail the job if the runner has the wrong system.
      # Otherwise, the check passes but skips the target system.
      - name: Check system
        run: test "$(nix eval --raw --impure --expr builtins.currentSystem)" = "${{ matrix.system }}"

      - name: nix flake check
        run: nix flake check
