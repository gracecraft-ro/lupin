# Runs `nix flake check` on each pull request to main or release/next.
# `nix flake check` checks only the system it runs on.
# The job runs once for each system below.
name: CI

on:
  pull_request:
    branches: [main, release/next]

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The `ubuntu-latest` runner is x64 Linux.
          - system: x86_64-linux
            runner: ubuntu-latest
          # The `macos-latest` runner is an Apple Silicon Mac. It runs macOS 26.
          # The source is the actions/runner-images README.
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Fail the job if the runner has the wrong system.
      # Otherwise, the check passes but skips the target system.
      - name: Check system
        run: test "$(nix eval --raw --impure --expr builtins.currentSystem)" = "${{ matrix.system }}"

      - name: nix flake check
        run: nix flake check
